# 发布 html2pptx-mcp 到 PyPI（trusted publishing，无需密码）
# 前置：在 pypi.org → 项目发布页登记 Trusted Publisher：
#   owner=<github 用户/组织>  repository=<仓库名>  workflow=publish.yml
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment 名与 PyPI Trusted Publisher 里登记的保持一致（大小写敏感）
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build（wheel + sdist）
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: wheel 自检（契约数据必须随包分发）
        run: python scripts/check_wheel.py
      - name: 冒烟（wheel 安装后入口可用）
        run: |
          python -m pip install --no-deps dist/*.whl
          html2pptx-mcp --version
          html2pptx-cli contract --format llm | head -n 3
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
