<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>标题页</title></head>
<body>
  <!-- 版式一：标题页（门禁 §10.2 三典型版式之一）
       覆盖：2 段 linear-gradient 根背景、accent 条、大标题、副标题、
             rgba 半透明胶囊(border+radius+px 行高垂直居中)、rotate 装饰圆 -->
  <div id="page" style="width:1280px;height:720px;background:linear-gradient(135deg,#1E1B4B 0%,#4C1D95 100%)">
    <div style="position:absolute;left:80px;top:72px;width:72px;height:8px;background-color:#F59E0B;border-radius:4px"></div>
    <div style="position:absolute;left:80px;top:240px;width:900px;height:150px;font-size:64px;font-weight:bold;color:#FFFFFF;line-height:1.2">HTML 映射表驱动生成</div>
    <div style="position:absolute;left:80px;top:410px;width:800px;height:40px;font-size:24px;color:#C7D2FE;line-height:1.5">受限子集 PoC：白名单校验 · auto-fix · DOM 序映射</div>
    <div style="position:absolute;left:80px;top:560px;width:220px;height:56px;background-color:rgba(255,255,255,0.12);border:1px solid #6366F1;border-radius:28px;font-size:18px;color:#E0E7FF;text-align:center;line-height:56px">v1.1 · 方案验证</div>
    <div style="position:absolute;left:1040px;top:480px;width:160px;height:160px;background-color:#6366F1;opacity:0.35;border-radius:80px;transform:rotate(5deg)"></div>
  </div>
</body>
</html>
